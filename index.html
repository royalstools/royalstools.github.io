<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Vibe-coded applets for all your Royals needs.">
<title>Royals Tools</title>
<style>
  :root {
    --bg: #f6f7f9;
    --card: #fff;
    --text: #1a1d23;
    --muted: #6b7280;
    --accent: #2563eb;
    --border: #e5e7eb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115;
      --card: #181b21;
      --text: #e8eaed;
      --muted: #9aa0a9;
      --accent: #6ea8ff;
      --border: #2a2e36;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 48px 16px;
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 32px; }
  h1 { margin: 0 0 4px; font-size: 2rem; letter-spacing: -0.02em; }
  header p { margin: 0; color: var(--muted); }
  .grid { display: grid; gap: 12px; }
  .card {
    display: block;
    padding: 16px 20px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: inherit;
    text-decoration: none;
    transition: border-color .15s, transform .15s;
  }
  .card:hover, .card:focus-visible {
    border-color: var(--accent);
    transform: translateY(-1px);
    outline: none;
  }
  .card strong { display: block; color: var(--accent); }
  .card span { color: var(--muted); font-size: .9rem; }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Royals Tools</h1>
      <p>Vibe-coded applets for all your Royals needs.</p>
    </header>
    <main class="grid">
      <a class="card" href="https://royalstools.github.io/applets/mastermind.html">
        <strong>GPQ Mastermind Calculator</strong>
        <span>Work out the solution for GPQ Mastermind.</span>
      </a>
      <a class="card" href="https://royalstools.github.io/scheduler.html">
        <strong>Scheduler</strong>
        <span>A minimalist dark 24-hour scheduler.</span>
      </a>
      <a class="card" href="https://royalstools.github.io/scaleplayer.html">
        <strong>Scale Player</strong>
        <span>Play notes from ragas and world scales, with a drone.</span>
      </a>
      <a class="card" href="https://royalstools.github.io/slowtide.html">
        <strong>Slow Tide</strong>
        <span>Guided breathing with a glowing orb.</span>
</a>

    </main>
  </div>
</body>
</html>
