<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>My GitHub Website – Links Demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 16px;
      line-height: 1.6;
      background: #f5f5f5;
    }
    header {
      text-align: center;
      margin-bottom: 32px;
    }
    main {
      background: #ffffff;
      padding: 24px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    code {
      background: #f0f0f0;
      padding: 2px 4px;
      border-radius: 4px;
      font-size: 0.95em;
    }
    pre {
      background: #1e1e1e;
      color: #f5f5f5;
      padding: 12px 16px;
      border-radius: 6px;
      overflow-x: auto;
      font-size: 0.95em;
    }
    a {
      color: #0366d6;
    }
    a:hover {
      text-decoration: underline;
    }
    h2 {
      margin-top: 28px;
    }
    ul {
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Royals Tools</h1>
    <p>Vibe-coded applets for all your Royals needs.</p>
  </header>

  <main>
    <section>
      <a href="https://example.com">GPQ Mastermind Caclculator</a>
    </section>
  </main>
</body>
</html>
