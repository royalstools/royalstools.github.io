<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scale player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #EEF0F6; --surface: #FFFFFF; --ink: #1B1E2E; --muted: #5B6078; --line: #D5D9E6;
  --accent: #4B3FD0; --on-accent: #FFFFFF; --glow: #F2B632; --on-glow: #2A1F00;
  --display: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
  --body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12141F; --surface: #1B1E2E; --ink: #ECEEF7; --muted: #9AA0BA; --line: #2E3248;
    --accent: #8F84FF; --on-accent: #12141F; --glow: #F2B632; --on-glow: #2A1F00;
  }
}
:root[data-theme="dark"] {
  --bg: #12141F; --surface: #1B1E2E; --ink: #ECEEF7; --muted: #9AA0BA; --line: #2E3248;
  --accent: #8F84FF; --on-accent: #12141F; --glow: #F2B632; --on-glow: #2A1F00;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--body); font-size: 16px; line-height: 1.5;
  -webkit-tap-highlight-color: transparent;
}
main { max-width: 480px; margin: 0 auto; padding: 20px 16px 32px; }
h1 { font-family: var(--display); font-weight: 600; font-size: 28px; line-height: 1.1; margin: 4px 0 4px; letter-spacing: -0.01em; }
.sub { color: var(--muted); margin: 0 0 20px; font-size: 15px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-bottom: 14px; }
label.lab { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
select {
  width: 100%; height: 46px; font: inherit; color: var(--ink); background: var(--bg);
  border: 1px solid var(--line); border-radius: 10px; padding: 0 12px;
}
.readout { display: flex; align-items: baseline; gap: 12px; margin: 4px 0 2px; }
.note { font-family: var(--display); font-weight: 600; font-size: 64px; line-height: 1; letter-spacing: -0.02em; min-width: 2.3ch; }
.meta { color: var(--muted); font-size: 15px; }
.swara { margin-left: auto; font-family: var(--display); font-size: 22px; font-weight: 600; color: var(--accent); }
svg.wave { display: block; width: 100%; height: 64px; margin-top: 8px; }
svg.wave path { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linejoin: round; }
.ladder {
  display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 10px; margin: 0 -2px;
  scroll-snap-type: x proximity; -webkit-overflow-scrolling: touch;
}
.ladder button {
  flex: 0 0 auto; scroll-snap-align: center; min-width: 56px; height: 56px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--bg); color: var(--ink);
  font: 600 15px var(--display); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; cursor: pointer;
}
.ladder button small { font: 400 11px var(--body); color: var(--muted); }
.ladder button.on { background: var(--glow); border-color: var(--glow); color: var(--on-glow); }
.ladder button.on small { color: var(--on-glow); }
.play {
  width: 100%; height: 56px; border: 0; border-radius: 14px; background: var(--accent); color: var(--on-accent);
  font: 600 18px var(--display); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;
}
.play svg { width: 18px; height: 18px; fill: currentColor; }
.row { display: flex; align-items: center; gap: 12px; margin-top: 14px; }
.row:first-child { margin-top: 0; }
.row label { width: 64px; font-size: 14px; color: var(--muted); }
.row output { width: 44px; text-align: right; font-size: 14px; font-variant-numeric: tabular-nums; }
input[type=range] { flex: 1; min-width: 0; height: 32px; accent-color: var(--accent); }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.foot { color: var(--muted); font-size: 13px; margin: 18px 4px 0; }
</style>
</head>
<body>
<main>
  <h1>Scale player</h1>
  <p class="sub">A triangle wave that only plays the notes of the scale you pick.</p>

  <div class="card">
    <label class="lab" for="sc">Scale</label>
    <select id="sc">
      <optgroup label="Ragas">
        <option value="0,1,4,5,7,8,11">Raga Bhairav</option>
        <option value="0,2,4,6,7,9,11">Raga Yaman</option>
        <option value="0,1,3,6,7,8,11">Raga Todi</option>
      </optgroup>
      <optgroup label="Elsewhere">
        <option value="0,1,4,5,7,8,10">Hijaz (Arabic)</option>
        <option value="0,2,3,7,8">Hirajoshi (Japanese)</option>
      </optgroup>
      <optgroup label="Western">
        <option value="0,2,4,5,7,9,11">C major</option>
        <option value="0,2,3,5,7,8,10">C natural minor</option>
        <option value="0,2,4,7,9">C major pentatonic</option>
      </optgroup>
    </select>
  </div>

  <div class="card">
    <div class="readout">
      <div class="note" id="nn">C4</div>
      <div class="meta" id="hz">261.6 Hz</div>
      <div class="swara" id="sw">Sa</div>
    </div>
    <svg class="wave" viewBox="0 0 340 64" preserveAspectRatio="none" role="img" aria-label="Triangle wave shape"><path id="wp" d=""/></svg>
  </div>

  <div class="card">
    <label class="lab" for="f">Pitch</label>
    <input type="range" id="f" min="0" max="10" step="1" value="0" style="width:100%">
    <div class="ladder" id="ladder" role="group" aria-label="Notes in this scale"></div>
  </div>

  <button class="play" id="tg" aria-label="Play or stop">
    <svg viewBox="0 0 24 24" id="ico" aria-hidden="true"><path d="M7 4l13 8-13 8z"/></svg>
    <span id="lbl">Play</span>
  </button>

  <div class="card" style="margin-top:14px">
    <div class="row">
      <label for="v">Volume</label>
      <input type="range" id="v" min="0" max="100" step="1" value="25">
      <output id="vo">25%</output>
    </div>
    <div class="row">
      <label for="dv">Drone</label>
      <input type="range" id="dv" min="0" max="100" step="1" value="60">
      <output id="dvo">60%</output>
    </div>
  </div>

  <p class="foot">Pitches are tuned like a piano (equal temperament), so ragas here are close approximations. Turn your volume up slowly.</p>
</main>

<script>
var ctx = null, osc = null, gain = null, dron = [], dgain = null, on = false;
var names = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
var swaras = ['Sa','re','Re','ga','Ga','Ma','Ma#','Pa','dha','Dha','ni','Ni'];
var $ = function (id) { return document.getElementById(id); };
var f = $('f'), v = $('v'), sc = $('sc'), dv = $('dv'), ladder = $('ladder');
var notes = [], curMidi = 60;

var PLAY_ICON = 'M7 4l13 8-13 8z';
var STOP_ICON = 'M6 5h4v14H6zM14 5h4v14h-4z';

function noteName(m) { return names[m % 12] + (Math.floor(m / 12) - 1); }
function freq(m) { return 440 * Math.pow(2, (m - 69) / 12); }

function build() {
  var pcs = sc.value.split(',').map(Number);
  notes = [];
  for (var m = 48; m <= 84; m++) { if (pcs.indexOf(m % 12) > -1) { notes.push(m); } }
  var best = 0, bd = 999;
  for (var i = 0; i < notes.length; i++) {
    var d = Math.abs(notes[i] - curMidi);
    if (d < bd) { bd = d; best = i; }
  }
  f.max = notes.length - 1;
  f.value = best;
  ladder.innerHTML = '';
  notes.forEach(function (m, i) {
    var b = document.createElement('button');
    b.type = 'button';
    b.dataset.i = i;
    b.innerHTML = noteName(m) + '<small>' + swaras[m % 12] + '</small>';
    ladder.appendChild(b);
  });
}

function draw(hz) {
  var cycles = Math.max(1, Math.min(6, Math.round(hz / 110))), w = 340, h = 64, p = 'M0 ' + (h / 2);
  for (var i = 0; i < cycles; i++) {
    var x0 = i * w / cycles, q = w / cycles / 4;
    p += ' L' + (x0 + q).toFixed(1) + ' 6 L' + (x0 + 3 * q).toFixed(1) + ' ' + (h - 6) + ' L' + (x0 + 4 * q).toFixed(1) + ' ' + (h / 2);
  }
  $('wp').setAttribute('d', p);
}

function upd() {
  curMidi = notes[+f.value];
  var hz = freq(curMidi);
  $('nn').textContent = noteName(curMidi);
  $('hz').textContent = hz.toFixed(1) + ' Hz';
  $('sw').textContent = swaras[curMidi % 12];
  $('vo').textContent = v.value + '%';
  $('dvo').textContent = dv.value + '%';
  $('lbl').textContent = on ? 'Stop' : 'Play';
  $('ico').firstElementChild.setAttribute('d', on ? STOP_ICON : PLAY_ICON);
  var btns = ladder.children, act = null;
  for (var i = 0; i < btns.length; i++) {
    var is = i === +f.value;
    btns[i].classList.toggle('on', is);
    if (is) { act = btns[i]; }
  }
  if (act) {
    ladder.scrollTo({ left: act.offsetLeft - ladder.clientWidth / 2 + act.clientWidth / 2, behavior: 'smooth' });
  }
  if (osc) { osc.frequency.setTargetAtTime(hz, ctx.currentTime, 0.015); }
  if (gain) { gain.gain.setTargetAtTime(v.value / 100 * 0.5, ctx.currentTime, 0.02); }
  if (dgain) { dgain.gain.setTargetAtTime(dv.value / 100 * 0.25, ctx.currentTime, 0.05); }
  draw(hz);
}

function start() {
  var AC = window.AudioContext || window.webkitAudioContext;
  if (!ctx) { ctx = new AC(); }
  if (ctx.resume) { ctx.resume(); }
  osc = ctx.createOscillator();
  gain = ctx.createGain();
  osc.type = 'triangle';
  osc.frequency.value = freq(curMidi);
  gain.gain.value = 0;
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start();
  dgain = ctx.createGain();
  dgain.gain.value = 0;
  var lp = ctx.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.value = 1500;
  lp.connect(dgain);
  dgain.connect(ctx.destination);
  dron = [];
  [[48, 1], [55, 0.7], [60, 0.8], [72, 0.3]].forEach(function (p) {
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sawtooth';
    o.frequency.value = freq(p[0]);
    g.gain.value = p[1] * 0.4;
    o.connect(g);
    g.connect(lp);
    o.start();
    dron.push(o);
  });
  on = true;
}

function stop() {
  var o = osc, g = gain, ds = dron, dg = dgain;
  g.gain.setTargetAtTime(0, ctx.currentTime, 0.02);
  dg.gain.setTargetAtTime(0, ctx.currentTime, 0.02);
  setTimeout(function () {
    o.stop(); o.disconnect();
    ds.forEach(function (x) { x.stop(); x.disconnect(); });
  }, 150);
  osc = null; gain = null; dron = []; dgain = null; on = false;
}

$('tg').addEventListener('click', function () {
  if (on) { stop(); } else { start(); }
  upd();
});
ladder.addEventListener('click', function (e) {
  var b = e.target.closest('button');
  if (!b) { return; }
  f.value = b.dataset.i;
  if (!on) { start(); }
  upd();
});
sc.addEventListener('change', function () { build(); upd(); });
f.addEventListener('input', upd);
v.addEventListener('input', upd);
dv.addEventListener('input', upd);
build();
upd();
</script>
</body>
</html>
